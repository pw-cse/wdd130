<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>HTML Form - User Poll</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <h1>WDD 130 | HTML Form - User Poll</h1>

    <form>
        <fieldset>
            <legend>Contact Information</legend>

            <label for="name">Full Name:</label>
            <input type="text" id="name" name="name">

            <label for="email">Email:</label>
            <input type="email" id="email" name="email">
        </fieldset>

        <fieldset>
            <legend>Questions</legend>

            <label for="browser">What is your favorite internet browser?</label>
            <select id="browser" name="browser">
                <option value="chrome">Chrome</option>
                <option value="firefox">Firefox</option>
                <option value="edge">Edge</option>
                <option value="safari">Safari</option>
                <option value="other">Other</option>
            </select>

            <label>Do you have a household pet?<input type="checkbox" name="pet" id="pet"></label>

            <label for="feedback">List the places you have lived:</label>
            <textarea id="feedback" name="feedback" rows="4"
              placeholder="Florida, Amsterdam Netherlands, Timbuktu Mali"></textarea>
        </fieldset>

        <button type="submit">Submit Poll</button>
    </form>

    <footer>
        <p>©2024 | HTML Form - User Pol Activity | Charles Koui</p>
    </footer>

</body>

</html>
</body>

</html>
